name: Deploy Quartz to Server

on:
  push:
    branches:
      - v4
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 升级到 Quartz 4.5.2 所需的 Node 22 环境

      - name: Install Dependencies and Build
        run: |
          npm ci
          npx quartz build

      - name: Deploy via SSH Pipeline
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "=== 1. 初始化 SSH 环境 ==="
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "=== 2. 信任服务器指纹 ==="
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          echo "=== 3. 握手连通性测试 ==="
          ssh -i ~/.ssh/id_ed25519 $SERVER_USER@$SERVER_IP "echo 'SSH 连通性测试成功！'"

          echo "=== 4. 开始传输静态文件 (SRE Tar Pipe 模式) ==="
          # 在本地把 public 目录打包，通过 SSH 标准输入流传到服务器，并在服务器直接解压！
          tar -czf - -C public . | ssh -i ~/.ssh/id_ed25519 $SERVER_USER@$SERVER_IP "tar -xzf - -C /opt/blog/html/"

          echo "=== 部署完成！ ==="
