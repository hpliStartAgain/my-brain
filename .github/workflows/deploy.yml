name: Deploy Quartz to Server

on:
  push:
    branches:
      - v5-migration
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Build Quartz
        run: npx quartz build

      - name: Deploy via Single Archive
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "=== 0. SRE 网络底层 Hack: 规避 PMTU 黑洞 ==="
          sudo ip link set dev eth0 mtu 1200

          echo "=== 1. 初始化 SSH 环境 ==="
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          echo "=== 2. 本地打包静态文件 (对抗高延迟小文件风暴) ==="
          tar -czf blog_dist.tar.gz -C public .

          echo "=== 3. 传输单一压缩包 ==="
          rsync -avz --progress -e "ssh -i ~/.ssh/id_ed25519" blog_dist.tar.gz $SERVER_USER@$SERVER_IP:/tmp/

          echo "=== 4. 远端解压与覆盖部署 ==="
          ssh -i ~/.ssh/id_ed25519 $SERVER_USER@$SERVER_IP "tar -xzf /tmp/blog_dist.tar.gz -C /opt/blog/html/ && rm -f /tmp/blog_dist.tar.gz"

          echo "=== 🚀 部署完成！ ==="
