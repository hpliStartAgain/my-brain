# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 汀的知识碎片
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # 未接入统计：原 plausible 为上游默认值且未注册站点，脚本空跑；需要时可改为
  # analytics: { provider: umami, websiteId: ..., host: ... }
  locale: zh-CN
  baseUrl: ting.is-a.dev
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - 工作管理
    - Template
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # 这里的字体名供 og-image 生成分享卡片时使用；页面实际字体栈见下方 quartz-fonts 插件
    typography:
      header:
        name: Noto Serif SC
        weights: [600, 700]
      body: Noto Sans SC
      code: JetBrains Mono
    colors:
      # Claude 博客象牙色系 — 从 claude.com/blog CSS 精确提取
      lightMode:
        light: "#faf9f5" # 象牙白背景 (Claude gray-050)
        lightgray: "#e8e6dc" # 温暖灰边框 (Claude gray-200)
        gray: "#87867f" # 柔和次要文字 (Claude gray-500)
        darkgray: "#30302e" # 温暖主体文字 (Claude gray-750)
        dark: "#141413" # 深色标题 (Claude gray-950)
        secondary: "#c96442" # 陶土交互色 (Claude clay-interactive)
        tertiary: "#d97757" # 陶土装饰色 (Claude clay)
        highlight: rgba(201, 100, 66, 0.08)
        textHighlight: rgba(201, 100, 66, 0.15)
      darkMode:
        light: "#141413" # 温暖深色背景 (Claude gray-950)
        lightgray: "#3d3d3a" # 暗灰边框 (Claude gray-700)
        gray: "#73726c" # 次要文字 (Claude gray-550)
        darkgray: "#dedcd1" # 浅暖灰主体文字 (Claude gray-250)
        dark: "#faf9f5" # 象牙白标题 (Claude gray-050)
        secondary: "#d97757" # 亮陶土色 (Claude clay)
        tertiary: "#c96442" # 深陶土色 (Claude clay-interactive)
        highlight: rgba(217, 119, 87, 0.15)
        textHighlight: rgba(217, 119, 87, 0.25)
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  # 构建期内容整理：去掉与 title 重复的正文首个 H1；从「摘要」生成中文 meta description。
  # 必须在 obsidian-flavored-markdown(30) 与 table-of-contents(50) 之前。
  - source: ./plugins/content-polish
    enabled: true
    options:
      descriptionLength: 140
    order: 25
  # mermaid 自定义配色 fork — 替换官方 obsidian-flavored-markdown
  - source: ./plugins/obsidian-flavored-markdown-fork
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  # quartz-fonts 用自己的默认值硬编码 h1-h6 字体（默认 Schibsted Grotesk），
  # 必须显式配置 header，否则 theme.typography 不生效
  # fontOrigin: local —— 本插件只负责写 CSS 变量（完整回退栈），不再注入阻塞渲染的
  # Google Fonts <link>；Noto Serif SC / JetBrains Mono 由 Head.tsx 异步加载，
  # 大陆访问 Google 失败时直接落到系统字体，不会白屏。
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: local
      header: '"Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", "Microsoft YaHei", serif'
      title: '"Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", "Microsoft YaHei", serif'
      body: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "HarmonyOS Sans SC", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", sans-serif'
      code: '"JetBrains Mono", "Cascadia Code", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace'
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  # fork：主索引不再内嵌全文（原 47MB/页），全文拆到 static/searchContent.json 按需加载
  - source: ./plugins/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  # fork：专栏目录页按文件名序号排序（原版按日期 + 标题，章节顺序会乱）
  - source: ./plugins/folder-page
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # fork：修复当前文章 scrollIntoView 连带滚动整个窗口（打开文章后标题被滚出视口）
  - source: ./plugins/explorer
    enabled: true
    options:
      title: 文章导航
      # 默认收起所有文件夹，防止冷启动渲染全量 DOM 树
      folderDefaultState: collapsed
      # 关闭本地状态恢复，阻止 JS 深度遍历几千节点
      useSavedState: false
      # 点击文件夹名折叠/展开，而不是跳转
      folderClickBehavior: collapse
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  # fork：首次打开搜索时才拉全文并建索引，页面加载不再全量建 FlexSearch 索引
  - source: ./plugins/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  # tag-list 挪到标题上方，作为 claude 风格的"分类标签"
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 8
      condition: not-index
  # 阅读进度条 + 复制正文按钮 — claude.com/blog 风格
  - source: ./plugins/article-tools
    enabled: true
    options:
      showProgress: true
      showCopy: true
      copyLabel: 复制正文
    layout:
      position: beforeBody
      priority: 40
      condition: not-index
  # 首页文章轮播 — 仅首页显示。放在正文（关于我 + 专栏地图）之后：
  # 首屏先交代"我是谁、这里有什么"，随机推荐作为逛完之后的彩蛋
  - source: ./plugins/article-carousel
    enabled: true
    options:
      title: 随机碎片
      showCount: 4
    layout:
      position: afterBody
      priority: 30
      condition: index-only
  # 首页标签筛选 pill 栏 — 模仿 claude blog 顶部分类筛选
  - source: ./plugins/tag-pills
    enabled: true
    options:
      title: 按标签逛逛
      maxTags: 16
      showAllLink: true
      # 用途 / 结构类标签不适合当作"领域入口"
      excludeTags: [面试, 专栏导览, 译书]
    layout:
      position: afterBody
      priority: 40
      condition: index-only
  # 滚动渐显 — 首页卡片 / 列表行 fade-in-up
  - source: ./plugins/scroll-reveal
    enabled: true
    layout:
      position: afterBody
      priority: 90
      display: all
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      rootName: 首页
      # 当前页标题紧接着就是大标题，面包屑里再出现一次是重复信息
      showCurrentPage: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # fork：页脚改为「© 年份 作者 · 基于 Quartz 构建」，样式改为分隔线 + 灰字
  - source: ./plugins/footer
    enabled: true
    options:
      author: 李浩鹏（汀）
      links:
        GitHub: https://github.com/hpliStartAgain
        RSS 订阅: /index.xml
        站点源码: https://github.com/hpliStartAgain/my-brain
  # 首页「最近更新」：持续更新本身就是一个知识库最有说服力的信号
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: 最近更新
      limit: 8
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: afterBody
      priority: 20
      condition: index-only
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # 注意：note-properties 同时是 frontmatter 解析器(transformer)和属性面板组件(component)。
  # 必须启用才能解析 YAML frontmatter(title/date/tags等)，否则整站 frontmatter 失效。
  # hidePropertiesView: true 仅隐藏可视化属性面板 UI（v4 没有这个面板），不影响解析。
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
